<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIndex Web | Verifiable Index Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'Fira Code', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="h-16 border-b border-slate-800 flex items-center justify-between px-4 md:px-6 bg-slate-900/50 backdrop-blur-md z-30">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-900/20">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
            <div class="leading-tight">
                <h1 class="text-lg font-black tracking-tighter text-white uppercase">VIndex Web</h1>
                <p class="text-[9px] text-blue-500 font-bold tracking-widest uppercase">Verifiable Index Viewer</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div id="connection-status" class="flex items-center gap-2 text-xs font-medium px-3 py-1 rounded-full bg-slate-800 border border-slate-700">
                <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                <span class="text-slate-400 text-[10px] uppercase tracking-wider">Idle</span>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- Sidebar for Config & Metadata -->
        <aside class="w-80 border-r border-slate-800 bg-slate-900/50 p-6 flex flex-col gap-6 custom-scrollbar overflow-y-auto">
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-2">Configuration</label>
                <div class="space-y-3">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">VIndex Lookup Path</label>
                        <input id="config-vindex-url" type="text" value="./lookup" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs mono outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Input Log Base URL</label>
                        <input id="config-inlog-url" type="text" value="../inputlog" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs mono outline-none focus:border-blue-500">
                    </div>
                    <div class="flex items-center gap-2">
                        <input id="config-use-woodpecker" type="checkbox" checked class="rounded border-slate-800 bg-slate-950 text-blue-600 focus:ring-0">
                        <label for="config-use-woodpecker" class="text-[10px] text-slate-400">Link to Woodpecker Web</label>
                    </div>
                </div>
            </div>

            <div id="metadata-section" class="hidden space-y-4">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-2">VIndex Metadata</label>
                
                <div class="bg-black/40 rounded-xl border border-slate-800 p-4 space-y-3">
                    <div>
                        <span class="text-[9px] text-slate-500 block">Key Hash (SHA-256)</span>
                        <span id="meta-key-hash" class="mono text-[10px] text-blue-400 break-all">--</span>
                    </div>
                    <div>
                        <span class="text-[9px] text-slate-500 block">Map Root</span>
                        <span id="meta-map-root" class="mono text-[10px] text-emerald-400 break-all">--</span>
                    </div>
                    <div>
                        <span class="text-[9px] text-slate-500 block">Input Log Tree Size</span>
                        <span id="meta-inlog-size" class="font-bold text-white">--</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <section class="flex-1 flex flex-col bg-slate-950 min-w-0">
            <!-- Search Bar -->
            <div class="p-6 border-b border-slate-800 bg-slate-900/20 flex gap-4">
                <input id="search-input" type="text" placeholder="Enter pre-image key (e.g. foo)..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:ring-1 focus:ring-blue-500 outline-none transition-all">
                <button onclick="app.lookup()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-bold shadow-lg shadow-blue-900/20 transition-all">Lookup</button>
            </div>

            <!-- Results Container -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-6">
                <div id="results-container" class="space-y-4">
                    <div class="flex flex-col items-center justify-center h-64 text-slate-500">
                        <svg class="w-8 h-8 mb-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <span>Enter a key above to search the index.</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Detail Modal -->
    <div id="detail-overlay" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h3 class="text-lg font-bold">Leaf Inspector</h3>
                <button onclick="app.closeDetail()" class="p-2 hover:bg-slate-800 rounded-lg text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6 space-y-4 overflow-y-auto custom-scrollbar">
                <div>
                    <span class="text-[10px] text-slate-500 uppercase font-bold block mb-1 tracking-widest">Index</span>
                    <div id="detail-index" class="text-xl font-bold mono text-blue-500">--</div>
                </div>
                <div>
                    <span class="text-[10px] text-slate-500 uppercase font-bold block mb-1 tracking-widest">Content</span>
                    <pre id="detail-content" class="p-5 bg-slate-950 rounded-xl text-[12px] mono break-all text-slate-300 border border-slate-800 leading-relaxed shadow-inner overflow-x-auto whitespace-pre-wrap">--</pre>
                </div>
            </div>
            <div class="p-4 border-t border-slate-800 bg-slate-900/50 flex justify-end">
                <button onclick="app.closeDetail()" class="px-8 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-bold shadow-lg shadow-blue-900/20 transition-all">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Helper to hash a string to SHA-256 hex
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // Helper to parse OutputLogLeaf
        // Format: <hex_root>\n<checkpoint>
        function parseOutputLogLeaf(bytes) {
            const decoder = new TextDecoder('utf-8');
            const text = decoder.decode(bytes);
            const newlineIndex = text.indexOf('\n');
            if (newlineIndex === -1) {
                throw new Error("Invalid output log leaf format");
            }
            const mapRootHex = text.substring(0, newlineIndex).trim();
            const inputLogCp = text.substring(newlineIndex + 1);
            return { mapRootHex, inputLogCp };
        }

        // Helper to parse checkpoint
        function parseCheckpoint(text) {
            const lines = text.trim().split('\n');
            if (lines.length >= 2) {
                const treeSize = parseInt(lines[1], 10);
                return { treeSize, lines };
            }
            throw new Error("Invalid checkpoint format");
        }

        // Helper to format tile index (same as woodpecker)
        function formatTileIndex(n) {
            let s = n.toString();
            while (s.length < 3) s = '0' + s;
            const chunks = [];
            for (let i = s.length; i > 0; i -= 3) {
                let chunk = s.substring(Math.max(0, i - 3), i);
                while (chunk.length < 3) chunk = '0' + chunk;
                chunks.unshift(chunk);
            }
            for (let i = 0; i < chunks.length - 1; i++) {
                chunks[i] = 'x' + chunks[i];
            }
            return chunks.join('/');
        }

        // Parse LVP stream
        function parseLVP(uint8Array) {
            const records = [];
            let pointer = 0;
            const dataView = new DataView(uint8Array.buffer, uint8Array.byteOffset, uint8Array.byteLength);

            while (pointer + 2 <= uint8Array.length) {
                const length = dataView.getUint16(pointer, false);
                const start = pointer + 2;
                if (start + length > uint8Array.length) {
                    break;
                }
                records.push(uint8Array.slice(start, start + length));
                pointer = start + length;
            }
            return records;
        }

        const app = {
            config: {
                tileSize: 256
            },
            state: {
                inputLogTreeSize: 0,
                keyHashHex: '',
                indices: [],
                tileCache: {}
            },

            init() {
                this.setupListeners();
            },

            setupListeners() {
                document.getElementById('search-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.lookup();
                    }
                });
            },

            updateStatus(type, msg) {
                const el = document.getElementById('connection-status');
                const dot = el.querySelector('span');
                const text = el.querySelectorAll('span')[1];
                text.textContent = msg;
                dot.className = "w-2 h-2 rounded-full " + (type === 'success' ? 'bg-emerald-500' : type === 'fetching' ? 'bg-blue-500 animate-pulse' : 'bg-red-500');
            },

            async lookup() {
                const input = document.getElementById('search-input').value.trim();
                if (!input) return;

                this.state.tileCache = {};
                this.updateStatus('fetching', 'Looking up...');
                document.getElementById('results-container').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-64 text-slate-500">
                        <svg class="w-8 h-8 animate-spin mb-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        <span>Querying VIndex...</span>
                    </div>
                `;

                try {
                    const hashHex = await sha256(input);
                    this.state.keyHashHex = hashHex;
                    
                    const vindexUrl = document.getElementById('config-vindex-url').value.trim();
                    const url = `${vindexUrl}/${hashHex}`;
                    
                    const response = await fetch(url);
                    if (!response.ok) {
                        if (response.status === 404) {
                            this.renderNotFound();
                            this.updateStatus('success', 'Not Found');
                            return;
                        }
                        throw new Error(`VIndex responded with ${response.status}`);
                    }

                    const data = await response.json();
                    this.handleLookupResponse(data);
                    this.updateStatus('success', 'Done');
                } catch (e) {
                    console.error(e);
                    this.updateStatus('error', 'Error');
                    this.renderError(e.message);
                }
            },

            handleLookupResponse(resp) {
                // Parse OutputLogLeaf to get Map Root and Input Log Checkpoint
                // OutputLogLeaf is base64 encoded in JSON?
                // Let's check api.go: OutputLogLeaf []byte `json:"output_log_leaf"`
                // In Go json encoding, []byte is base64 encoded.
                const leafBytes = Uint8Array.from(atob(resp.output_log_leaf), c => c.charCodeAt(0));
                const { mapRootHex, inputLogCp } = parseOutputLogLeaf(leafBytes);
                const { treeSize } = parseCheckpoint(inputLogCp);

                this.state.inputLogTreeSize = treeSize;

                // Update metadata sidebar
                document.getElementById('meta-key-hash').textContent = this.state.keyHashHex;
                document.getElementById('meta-map-root').textContent = mapRootHex;
                document.getElementById('meta-inlog-size').textContent = treeSize.toLocaleString();
                document.getElementById('metadata-section').classList.remove('hidden');

                this.state.indices = resp.index_value || [];
                this.renderResults(this.state.indices);
            },

            renderResults(indices) {
                const container = document.getElementById('results-container');
                container.innerHTML = '';

                if (indices.length === 0) {
                    this.renderNotFound();
                    return;
                }

                const title = document.createElement('h3');
                title.className = "text-sm font-semibold text-slate-400 mb-3 flex items-center justify-between";
                title.innerHTML = `
                    <span>Found ${indices.length} matching entries:</span>
                    <button id="btn-fetch-all" onclick="app.fetchAll()" class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold transition-all">
                        Fetch All
                    </button>
                `;
                container.appendChild(title);

                const list = document.createElement('div');
                list.className = "space-y-3";

                const inLogUrl = document.getElementById('config-inlog-url').value.trim();
                const useWoodpecker = document.getElementById('config-use-woodpecker').checked;

                indices.forEach(idx => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-4 bg-slate-900 border border-slate-800 rounded-xl hover:border-blue-500/50 transition-all";
                    
                    let actionsHtml = '';
                    if (useWoodpecker) {
                        actionsHtml += `
                            <a href="${inLogUrl}/index.html#entry-${idx}" target="_blank" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold border border-slate-700 transition-all flex items-center gap-1">
                                Woodpecker
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                            </a>
                        `;
                    }
                    actionsHtml += `
                        <button onclick="app.fetchLeaf(${idx})" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold transition-all">
                            Fetch Leaf
                        </button>
                    `;

                    div.innerHTML = `
                        <div class="flex items-center gap-4">
                            <span class="mono text-sm text-slate-400 font-bold">#${idx}</span>
                            <div class="h-6 w-[1px] bg-slate-800"></div>
                            <span id="preview-${idx}" class="text-xs text-slate-500 italic">Not fetched yet</span>
                        </div>
                        <div class="flex items-center gap-2">
                            ${actionsHtml}
                        </div>
                    `;
                    list.appendChild(div);
                });

                container.appendChild(list);
            },

            renderNotFound() {
                document.getElementById('results-container').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-64 text-slate-500">
                        <svg class="w-8 h-8 mb-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span>No entries found for this key.</span>
                    </div>
                `;
            },

            renderError(msg) {
                document.getElementById('results-container').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-64 text-red-400">
                        <svg class="w-8 h-8 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                        <span class="font-bold">Error: ${msg}</span>
                    </div>
                `;
            },

            async fetchAll() {
                const btn = document.getElementById('btn-fetch-all');
                if (!btn) return;
                btn.disabled = true;
                btn.textContent = "Fetching...";
                btn.className = "px-3 py-1 bg-slate-800 text-slate-500 rounded-lg text-xs font-semibold cursor-not-allowed";

                for (const idx of this.state.indices) {
                    await this.fetchLeaf(idx);
                }

                btn.textContent = "Fetched All";
            },

            async fetchLeaf(idx) {
                const previewEl = document.getElementById(`preview-${idx}`);
                previewEl.textContent = "Fetching...";
                previewEl.className = "text-xs text-blue-400 animate-pulse";

                try {
                    const inLogUrl = document.getElementById('config-inlog-url').value.trim();
                    const tileIdx = Math.floor(idx / this.config.tileSize);
                    const formattedTile = formatTileIndex(tileIdx);
                    
                    let url = `${inLogUrl}/tile/entries/${formattedTile}`;
                    const isFullTile = (tileIdx + 1) * this.config.tileSize <= this.state.inputLogTreeSize;
                    if (!isFullTile) {
                        const leavesCount = this.state.inputLogTreeSize % this.config.tileSize;
                        url = `${url}.p/${leavesCount}`;
                    }

                    let entries;
                    if (this.state.tileCache[url]) {
                        entries = this.state.tileCache[url];
                    } else {
                        const response = await fetch(url);
                        if (!response.ok) throw new Error(`Failed to fetch tile: ${response.status}`);
                        const buffer = await response.arrayBuffer();
                        entries = parseLVP(new Uint8Array(buffer));
                        this.state.tileCache[url] = entries;
                    }
                    
                    const localIdx = idx % this.config.tileSize;
                    if (localIdx >= entries.length) {
                        throw new Error(`Index ${idx} not found in fetched tile`);
                    }

                    const leafBytes = entries[localIdx];
                    const decoder = new TextDecoder('utf-8');
                    const text = decoder.decode(leafBytes);

                    // Try to format as JSON if possible
                    let display = text;
                    try {
                        const parsed = JSON.parse(text);
                        display = JSON.stringify(parsed, null, 2);
                    } catch(e) {}

                    previewEl.textContent = text.substring(0, 60) + (text.length > 60 ? '...' : '');
                    previewEl.className = "text-xs text-slate-300 mono truncate max-w-md cursor-pointer";
                    previewEl.onclick = () => this.showDetail(idx, display);
                } catch (e) {
                    console.error(e);
                    previewEl.textContent = `Error: ${e.message}`;
                    previewEl.className = "text-xs text-red-400";
                }
            },

            showDetail(idx, content) {
                document.getElementById('detail-index').textContent = `#${idx}`;
                document.getElementById('detail-content').textContent = content;
                document.getElementById('detail-overlay').classList.remove('hidden');
            },

            closeDetail() {
                document.getElementById('detail-overlay').classList.add('hidden');
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
